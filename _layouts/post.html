---
layout: default
---
<!-- Optional: Back link at the top of the post -->
<p><a href="{{ '/' | relative_url }}">&larr; Back to all posts</a></p>


<small>{{ page.date | date: "%-d %B %Y" }}</small>
<h1>{{ page.title }}</h1>

<p class="view">by {{ page.author | default: site.author }}</p>

{{content}}

{% if page.tags %}
  <small>tags: <em>{{ page.tags | join: "</em> - <em>" }}</em></small>
{% endif %}
